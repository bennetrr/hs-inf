name: Lint

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  editorconfig:
    name: Lint with editorconfig
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run eclint
        run: |
          npx eclint check .

  prettier:
    name: Lint WebApp with prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run prettier
        working-directory: webapp
        run: |
          npx prettier --check .
